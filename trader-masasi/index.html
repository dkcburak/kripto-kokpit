<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>Profesör</title>
<link rel="icon" href="../ikon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Profesör: 5 trader bir dairede, ortada Profesör; sağda onaylı işlem ve karar günlüğü. Veri: masa-veri dalı masa.json (yarım saatlik; mod kağıt/kuru/canlı). */
:root{--bg:#05080f;--panel:#0b111c;--line:#172238;--fg:#dbe6f5;--mute:#6c7f9c;--acc:#4fd1ff;--long:#2ee6a6;--short:#ff5a7a;--wait:#ffb547;--display:"Oxanium",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:13px;line-height:1.45;padding-block:max(14px,env(safe-area-inset-top,0px)) max(32px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background-image:radial-gradient(ellipse at 30% 0%,#0e1b30 0,transparent 55%)}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 16px}
h1{font:700 22px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;margin:0}
h1 span{color:var(--acc)}
.sys{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.sys b{color:var(--fg);font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--long);box-shadow:0 0 8px var(--long);margin-right:6px;vertical-align:middle}
.dot.kirmizi{background:var(--short);box-shadow:0 0 8px var(--short)}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.orbit{position:relative;aspect-ratio:1;max-width:100%;border-radius:12px;background:radial-gradient(circle at 50% 50%,#0d1626 0,#070c16 60%,var(--bg) 100%);border:1px solid var(--line);overflow:hidden}
.orbit canvas{width:100%;height:100%;display:block;cursor:pointer}
.orbit .leg{position:absolute;left:12px;bottom:10px;display:flex;gap:12px;color:var(--mute);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.orbit .tip{position:absolute;top:10px;right:12px;color:var(--mute);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.side{display:grid;gap:14px;min-width:0}
h2{font:700 11px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
h2 small{font:400 10px var(--mono);letter-spacing:0;text-transform:none}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px;min-width:0}
.coin{font:700 26px/1 var(--display);letter-spacing:.04em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font:700 10px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;border-radius:3px;border:1px solid;white-space:nowrap}
.onay{color:var(--long);border-color:var(--long);background:rgba(46,230,166,.08)}
.ret{color:var(--short);border-color:var(--short);background:rgba(255,90,122,.08)}
.bekle{color:var(--wait);border-color:var(--wait);background:rgba(255,181,71,.08)}
.gri{color:var(--mute);border-color:var(--line)}
.lv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;font-variant-numeric:tabular-nums}
.lv div{background:rgba(255,255,255,.025);border-radius:6px;padding:8px 10px;min-width:0}
.lv span{display:block;color:var(--mute);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.lv b{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.lv b.s{color:var(--short)} .lv b.g{color:var(--acc)} .lv b.tp{color:var(--long)}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:11px}
.meta b{color:var(--fg);font-weight:600}
.why{font-size:12px;border-left:2px solid var(--acc);padding-left:10px}
.chart{min-width:0}
.chart canvas{width:100%;height:300px;display:block}
.chart .cap{display:flex;justify-content:space-between;color:var(--mute);font-size:10px;padding:0 2px 6px;letter-spacing:.08em;text-transform:uppercase}
.sekme{display:flex;gap:6px;flex-wrap:wrap}
.sekme button{font:600 11px var(--mono);background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:5px 9px;cursor:pointer}
.sekme button.aktif{color:var(--acc);border-color:var(--acc)}
.sekme button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.feed{display:grid;gap:5px}
.sig{display:grid;grid-template-columns:48px 76px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-width:0}
.sig .t{color:var(--mute);font-size:11px}
.sig .who{font:700 12px var(--display);letter-spacing:.04em}
.sig .what{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sig .what i{font-style:normal;color:var(--mute)}
.sig.pick{border-color:var(--long)}
.bos{color:var(--mute);text-align:center;padding:28px 12px;background:var(--panel);border:1px dashed var(--line);border-radius:8px}
.note{color:var(--mute);font-size:11px;text-align:center}
.note a{color:var(--acc)}
@media (max-width:860px){.grid{grid-template-columns:1fr}.lv{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.sig{grid-template-columns:1fr auto;grid-template-areas:"who pill" "what what" "t t"}.sig .who{grid-area:who}.sig .pill{grid-area:pill}.sig .what{grid-area:what;white-space:normal}.sig .t{grid-area:t}.chart canvas{height:240px}}
@media (prefers-reduced-motion:reduce){.dot{box-shadow:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Profes<span>ör</span></h1>
  <div class="sys" id="sys"><span><i class="dot"></i>Yükleniyor</span><span id="sysYuk">Veri yükleniyor…</span></div>
</header>
<div class="grid">
  <div class="orbit">
    <canvas id="o" aria-label="Profesör: 5 trader ve ortada Profesör"></canvas>
    <div class="tip">Ajana dokun</div>
    <div class="leg"><span><i style="background:var(--acc)"></i>Sinyal</span><span><i style="background:var(--long)"></i>Onay</span><span><i style="background:var(--short)"></i>Ret</span><span><i style="background:var(--wait)"></i>Bekle</span></div>
  </div>
  <div class="side">
    <section><h2>Onaylı işlem <small id="onayliSay"></small></h2><div id="onayli"><div class="bos">Veri bekleniyor…</div></div></section>
    <section><h2>Haberci <small id="haberSay"></small></h2><div class="feed" id="haber"><div class="bos">Veri bekleniyor…</div></div></section>
    <section><h2>Profesör kararları <small id="kararSay"></small></h2><div class="feed" id="feed"></div></section>
  </div>
</div>
<p class="note" id="not">Kağıt mod: hiçbir işlem gerçek değildir. Yarım saatte bir yenilenir.</p>
</div>
