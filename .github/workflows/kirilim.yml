# Tek seferlik: hacimli kırılım fikri geriye dönük test. Salt okuma, emir yok.
name: kirilim
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-qb1mbc]
    paths: ['.github/workflows/kirilim.yml', 'test/kirilim.js']
permissions:
  contents: read
jobs:
  analiz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: ana, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { path: dal, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: ANA=ana node dal/test/kirilim.js "$RUNNER_TEMP/kirilim.md"
      - run: cat "$RUNNER_TEMP/kirilim.md" >> "$GITHUB_STEP_SUMMARY"
