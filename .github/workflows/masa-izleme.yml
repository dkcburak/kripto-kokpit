# Profesör izleme: yarım saatte bir 5 trader sinyal arar, Profesör karar verir, kağıt işlemler ilerler.
# Mod trader-masasi/ayar.json (ya da repo değişkeni MASA_MODU) ile: kagit (varsayılan) | kuru (hesabı okur, emri yazar, göndermez) | acik (Kırılım+Güç için MEXC'de GERÇEK emir).
# kuru/acik için Actions secrets: MEXC_API_KEY, MEXC_API_SECRET (yalnız işlem yetkili anahtar, çekim kapalı); isteğe bağlı TELEGRAM_TOKEN.
# Durum masa-veri dalında masa.json; panel (trader-masasi/index.html) bunu okur.
name: masa-izleme

on:
  schedule:
    - cron: '6,36 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: masa-izleme
  cancel-in-progress: false

jobs:
  izle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Testler
        run: node test/masa.test.js && node test/masa-izle.test.js && node test/masa-emir.test.js
      - name: Önceki durum (varsa)
        run: |
          git fetch --depth=1 "https://github.com/${{ github.repository }}.git" masa-veri 2>/dev/null && git show FETCH_HEAD:masa.json > "$RUNNER_TEMP/onceki.json" || echo "önceki durum yok, sıfırdan başlanır"
      - name: İzle
        env:
          MASA_MODU: ${{ vars.MASA_MODU }}
          MASA_RISK: ${{ vars.MASA_RISK }}
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: node trader-masasi/izle.js "$RUNNER_TEMP/onceki.json" "$RUNNER_TEMP/masa.json"
      - name: Yayınla (masa-veri dalı, tek commit)
        run: |
          cd "$RUNNER_TEMP"
          rm -rf yayin && mkdir yayin && cd yayin
          git init -q -b masa-veri
          cp "$RUNNER_TEMP/masa.json" .
          git -c user.name="trader-masasi" -c user.email="trader-masasi@users.noreply.github.com" add masa.json
          git -c user.name="trader-masasi" -c user.email="trader-masasi@users.noreply.github.com" commit -q -m "masa $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" masa-veri
