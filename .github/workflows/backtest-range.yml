# Range (yatay piyasa) al-sat backtest'i (test/backtest-range.js). MEXC açık verisi; anahtar yok, emir yok.
name: backtest-range

on:
  workflow_dispatch:
    inputs:
      gun:
        description: 'Kaç gün geriye'
        default: '180'
  push:
    paths:
      - 'test/backtest-range.js'
      - 'test/backtest-range2.js'
      - 'test/backtest-xs.js'
      - 'test/backtest-carry.js'
      - '.github/workflows/backtest-range.yml'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Coinler arası momentum / ters dönüş (günlük)
        run: node test/backtest-xs.js 900
      - name: Funding carry (spot al + vadeli short)
        run: node test/backtest-carry.js 900
