# Tek seferlik: son 48 saatin sert hareketlerinde tarayıcı kuralı ne yapardı? Salt okuma, emir yok.
name: hareket-analiz
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-qb1mbc]
    paths: ['.github/workflows/hareket-analiz.yml', 'test/hareket-analiz.js']
permissions:
  contents: read
jobs:
  analiz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: ana, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { path: dal, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: ANA=ana node dal/test/hareket-analiz.js "$RUNNER_TEMP/hareket.md"
      - run: cat "$RUNNER_TEMP/hareket.md" >> "$GITHUB_STEP_SUMMARY"
